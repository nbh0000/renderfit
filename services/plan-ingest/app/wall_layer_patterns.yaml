# 어떤 레이어를 벽으로 볼 것인가.
#
# 캐드 도면의 레이어 이름은 회사마다, 사람마다 다르다. AIA 표준(A-WALL)을 쓰는 곳도
# 있고 한글로 "벽체"라 적는 곳도 있고 그냥 "W"인 곳도 있다. 코드에 박아 두면 새 이름이
# 나올 때마다 배포해야 하므로 여기로 뺀다.
#
# 매칭은 **대소문자를 가리지 않고, 이름 어딘가에 들어 있으면** 걸리는 방식이다.
# 그래서 넉넉히 넣어도 되지만, 너무 짧은 조각(예: "W")은 "WINDOW"까지 걸어 버리므로
# exclude 로 막는다.

wall:
  # 영문 — AIA / ISO 13567 계열과 그 변형
  - WALL
  - A-WALL
  - A_WALL
  - AWALL
  - I-WALL
  - S-WALL
  - WALLS
  - PARTITION
  - PARTN
  - CONCRETE
  - MASONRY
  - STUD
  - 0-WALL
  # 한글 — 국내 도면에서 실제로 보이는 것들
  - 벽
  - 벽체
  - 내벽
  - 외벽
  - 조적
  - 콘크리트
  - 칸막이

# 이름에 이것이 들어 있으면 벽으로 보지 않는다.
#
# wall 목록이 부분 문자열로 걸리기 때문에 필요하다 — "A-WALL-PATT"(해치)나
# "WALL-DIM"(치수)까지 벽으로 잡으면 두께 병합이 통째로 어긋난다.
exclude:
  - PATT      # 해치 무늬
  - HATCH
  - DIM       # 치수선
  - TEXT
  - IDEN      # 실명 표기
  - ANNO      # 주석
  - HIDDEN
  - CENTER    # 일점쇄선(중심선·대지경계선)
  - DEFPOINTS # 오토캐드가 치수에 쓰는 보이지 않는 레이어
  - 치수
  - 문자
  - 중심선

# 문·창 블록 이름.
#
# 여기 걸리면 openings 로, 안 걸리는 INSERT 는 fixtures 로 간다.
door:
  - DOOR
  - DR
  - 문
  - 출입문
  - 방화문
  - 미닫이
  - 여닫이

window:
  - WINDOW
  - WIN
  - 창
  - 창호
  - 창문

# 평행선 두 줄을 두께 있는 벽 하나로 볼 간격 (mm).
#
# 국내 도면의 벽은 얇으면 경량칸막이 60~90mm, 두꺼우면 외벽 200~300mm 다.
# 이보다 좁으면 해치선이나 마감선이고, 넓으면 서로 다른 벽 사이의 빈 공간이다.
thickness:
  min: 50
  max: 400

# 끝점이 이만큼 떨어져 있으면 같은 자리로 보고 붙여 방을 닫는다 (mm).
#
# 캐드에서 사람이 그린 벽은 모서리가 몇 mm 씩 어긋나 있는 일이 흔하다. 그대로 두면
# 방이 하나도 안 닫히고, 너무 넓게 잡으면 문틀 사이가 붙어 방 둘이 하나가 된다.
snap:
  gap: 100
